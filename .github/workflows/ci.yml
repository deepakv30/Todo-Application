name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Static sanity
        run: |
          test -f index.html
          test -f script.js
          test -f style.css
          grep -q localStorage script.js
          grep -q 'todo-' script.js
          grep -q 'todo-application-items' script.js
